name: CI

on:
  push:
  pull_request:

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

  npm-launcher:
    name: npm launcher smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    needs: unittest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packed npm artifact
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          npm pack --pack-destination "$package_dir"
          npm install --global "${package_dir}"/*.tgz
      - name: Run launcher without network access
        run: gh-unfollow --help

  python-wheel:
    name: Python wheel install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: gh-unfollow --version && github-unfollow --help
